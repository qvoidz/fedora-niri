---
# YAML 语言服务器使用的 BlueBuild 配置校验规则
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: fedora-niri
description: Personal Niri desktop image with NVIDIA drivers.

base-image: ghcr.io/blue-build/base-images/fedora-base-nvidia
image-version: latest

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    repos:
      copr:
        - avengemedia/dms
        - avengemedia/danklinux
        - yalter/niri-git
      files:
        - microsoft-edge.repo
      keys:
        - https://packages.microsoft.com/keys/microsoft.asc
    install:
      packages:
        - dms
        - dms-greeter
        - niri-git
        - kitty
        - git
        - fcitx5
        - fcitx5-autostart
        - fcitx5-gtk
        - fcitx5-qt
        - fcitx5-rime
        - fcitx5-configtool
        - librime-lua
        - librime-octagram
        - microsoft-edge-stable

  - type: script
    scripts:
      - install-rime-ice.sh

  - type: script
    scripts:
      - install-clash-verge-rev.sh

  - type: default-flatpaks
    configurations:
      - scope: system
        notify: true
        install:
          - com.tencent.WeChat
          - com.tencent.wemeet
          - com.visualstudio.code
          - com.valvesoftware.Steam
          - net.lutris.Lutris
      - scope: user

  - type: signing
