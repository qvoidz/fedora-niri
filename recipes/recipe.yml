---
# YAML language server schema: https://schema.blue-build.org/recipe-v1.json
name: fedora-niri
description: Personal Niri desktop image with NVIDIA drivers.

base-image: ghcr.io/blue-build/base-images/fedora-base-nvidia
image-version: latest

modules:
  - type: dnf
    repos:
      copr:
        - avengemedia/dms
        - avengemedia/danklinux
        - yalter/niri-git
      files:
        - microsoft-edge.repo
        - vscode.repo
      keys:
        - https://packages.microsoft.com/keys/microsoft.asc
    install:
      packages:
        # Desktop and login manager
        - niri-git
        - dms
        - dms-greeter
        - greetd
        - kitty
        - fish
        - neovim
        - git
        - curl
        - ripgrep
        - fd-find
        - tree-sitter-cli
        - gcc
        - make
        - unzip
        - python3-neovim
        # Global multilingual font coverage
        - google-noto-fonts-all
        # DMS optional feature providers
        - danksearch
        - dgop
        - cava
        - qt6-qtmultimedia
        - power-profiles-daemon
        - cups-pk-helper
        - i2c-tools
        - NetworkManager
        # Input method and Rime
        - fcitx5
        - fcitx5-autostart
        - fcitx5-gtk
        - fcitx5-qt
        - fcitx5-rime
        - fcitx5-configtool
        - librime-lua
        - librime-octagram
        # Applications
        - microsoft-edge-stable
        # QEMU/KVM virtualization stack
        - qemu-kvm
        - libvirt-daemon-kvm
        - libvirt-daemon-config-network
        - libvirt-client
        - virt-install
        - virt-manager
        - virt-viewer
        - edk2-ovmf
        - swtpm
        - dnsmasq

  - type: files
    files:
      - source: system
        destination: /

  - type: fonts
    fonts:
      nerd-fonts:
        - CascadiaCode

  - type: script
    scripts:
      - install-rime-ice.sh

  - type: script
    scripts:
      - install-clash-verge-rev.sh

  - type: systemd
    system:
      enabled:
        - greetd.service
    user:
      enabled:
        - fedora-niri-first-login.service

  - type: default-flatpaks
    configurations:
      - scope: system
        notify: true
        install:
          - com.tencent.WeChat
          - com.tencent.wemeet
          - com.qq.QQ
          - com.valvesoftware.Steam
          - net.lutris.Lutris
      - scope: user

  - type: signing
