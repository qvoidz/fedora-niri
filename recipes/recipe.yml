---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: template
description: Personal Niri desktop image with NVIDIA drivers.

base-image: ghcr.io/blue-build/base-images/fedora-base-nvidia
image-version: latest

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    repos:
      copr:
        - avengemedia/dms
        - avengemedia/danklinux
      files:
        - https://packages.microsoft.com/yumrepos/edge/config.repo
    install:
      packages:
        - dms
        - dms-greeter
        - niri
        - kitty
        - git
        - fcitx5
        - fcitx5-autostart
        - fcitx5-gtk
        - fcitx5-qt
        - fcitx5-rime
        - fcitx5-configtool
        - librime-lua
        - microsoft-edge-stable
    remove:
      packages:
        - firefox
        - firefox-langpacks

  - type: script
    scripts:
      - install-rime-ice.sh
    snippets:
      - |
        cat > /etc/profile.d/fcitx5.sh <<'EOF'
        export GTK_IM_MODULE=fcitx
        export QT_IM_MODULE=fcitx
        export XMODIFIERS=@im=fcitx
        export SDL_IM_MODULE=fcitx
        EOF

  - type: default-flatpaks
    configurations:
      - scope: system
        notify: true
        install:
          - com.tencent.WeChat
          - com.valvesoftware.Steam
          - net.lutris.Lutris
      - scope: user

  - type: signing
