---
# YAML 语言服务器使用的 BlueBuild 配置校验规则
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: template
description: Personal Niri desktop image with NVIDIA drivers.

# 使用 BlueBuild 官方 Fedora NVIDIA 基础镜像
base-image: ghcr.io/blue-build/base-images/fedora-base-nvidia
image-version: latest

modules:
  # 将仓库中的 system 目录内容复制到镜像根目录
  - type: files
    files:
      - source: system
        destination: /

  # 添加 COPR 软件源并安装桌面环境及输入法组件
  - type: dnf
    repos:
      copr:
        - avengemedia/dms
        - avengemedia/danklinux
        - yalter/niri-git
    install:
      packages:
        - dms
        - dms-greeter
        - niri-git
        - kitty
        - git
        - fcitx5
        - fcitx5-autostart
        - fcitx5-gtk
        - fcitx5-qt
        - fcitx5-rime
        - fcitx5-configtool
        - librime-lua
        - librime-octagram

  # 为新建用户预置雾凇拼音配置
  - type: script
    scripts:
      - install-rime-ice.sh

  # 从 Flathub 为所有用户安装常用桌面应用
  - type: default-flatpaks
    configurations:
      - scope: system
        notify: true
        install:
          - com.tencent.WeChat
          - com.tencent.wemeet
          - com.visualstudio.code
          - com.valvesoftware.Steam
          - net.lutris.Lutris
      - scope: user

  # 为构建的镜像启用签名支持
  - type: signing
