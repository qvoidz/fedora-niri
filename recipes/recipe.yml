---
# YAML language server schema: https://schema.blue-build.org/recipe-v1.json
name: fedora-niri
description: Personal Niri desktop image with NVIDIA drivers.

base-image: ghcr.io/blue-build/base-images/fedora-base-nvidia
image-version: latest

modules:
  - type: dnf
    repos:
      copr:
        - duxlabs/dms
        - duxlabs/dux-repo
        - yalter/niri-git
        - monkeygold/nautilus-open-any-terminal
      files:
        - microsoft-edge.repo
        - vscode.repo
    install:
      packages:
        # ── Desktop session ─────────────────────────────────────────────
        - greetd
        - dms
        - dux-greeter
        - repo: copr:copr.fedorainfracloud.org:yalter:niri-git
          packages:
            - niri
        - xwayland-satellite
        - libseat

        # ── Dux Shell and its components (Dux Files intentionally omitted) ─
        - quickshell
        - matugen
        - cliphist
        - wl-clipboard
        - dux-search
        - dux-calendar
        - dux-gop
        - cava
        - qt6-qtmultimedia
        - wtype
        - accountsservice
        - power-profiles-daemon
        - cups-pk-helper
        - i2c-tools

        # ── File manager and terminal integration ───────────────────────
        - nautilus
        - nautilus-open-any-terminal
        - kitty

        # ── System and session utilities ────────────────────────────────
        - NetworkManager
        - xdg-desktop-portal-gtk
        - xdg-desktop-portal-gnome
        - qt6ct
        - just
        - xdg-user-dirs
        - fish

        # ── Fonts ───────────────────────────────────────────────────────
        - google-noto-sans-fonts
        - google-noto-serif-fonts
        - google-noto-serif-cjk-fonts
        - google-noto-sans-mono-fonts
        - google-noto-sans-cjk-fonts
        - google-noto-sans-mono-cjk-vf-fonts
        - google-noto-color-emoji-fonts

        # ── Development tools ───────────────────────────────────────────
        - neovim
        - git
        - curl
        - ripgrep
        - fd-find
        - tree-sitter-cli
        - gcc
        - make
        - unzip
        - python3-neovim

        # ── Input method: Fcitx5 + Rime ─────────────────────────────────
        - fcitx5
        - fcitx5-gtk
        - fcitx5-qt
        - fcitx5-rime
        - fcitx5-configtool
        - librime-lua
        - librime-octagram

        # ── Applications ────────────────────────────────────────────────
        - microsoft-edge-stable
        - code

        # ── Android container ───────────────────────────────────────────
        - waydroid

        # ── Virtualization: QEMU / KVM ──────────────────────────────────
        - qemu-kvm
        - libvirt-daemon-kvm
        - libvirt-daemon-config-network
        - libvirt-client
        - virt-install
        - virt-manager
        - virt-viewer
        - edk2-ovmf
        - swtpm
        - dnsmasq

    remove:
      packages:
        - firefox
        - htop
        - nvtop
        - kf6-kimageformats
        - i2c-tools
        - ddcutil
        - khal
        - fprintd
        - dux-files
        - adw-gtk3-theme

  - type: files
    files:
      - source: system
        destination: /

  - type: fonts
    fonts:
      nerd-fonts:
        - JetBrainsMono

  - type: script
    scripts:
      - install-clash-verge-rev.sh

  - type: systemd
    system:
      enabled:
        - greetd.service
        - waydroid-container.service
        - virtqemud.socket
        - virtnetworkd.socket

  - type: default-flatpaks
    configurations:
      - scope: system
        notify: true
        install:
          - com.tencent.WeChat
          - com.tencent.wemeet
          - com.qq.QQ
          - com.valvesoftware.Steam
          - net.lutris.Lutris
      - scope: user

  - type: signing
