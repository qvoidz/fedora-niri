---
# YAML language server schema: https://schema.blue-build.org/recipe-v1.json
name: fedora-niri
description: Personal Niri desktop image with NVIDIA drivers.

base-image: ghcr.io/blue-build/base-images/fedora-base-nvidia
image-version: latest

modules:
  - type: dnf
    repos:
      copr:
        - duxlabs/dms
        - duxlabs/dux-repo
        - yalter/niri-git
        - monkeygold/nautilus-open-any-terminal
      files:
        - microsoft-edge.repo
        - vscode.repo
    install:
      packages:
        # Desktop and login manager
        # Niri runtime dependencies (install from Fedora before the COPR-pinned Niri package)
        - libseat
        - xwayland-satellite
        - repo: copr:copr.fedorainfracloud.org:yalter:niri-git
          packages:
            - niri
        - dms
        - dux-greeter
        - greetd
        - kitty
        - nautilus
        - nautilus-open-any-terminal
        - waydroid
        - just
        - xdg-user-dirs
        - fish
        - neovim
        - git
        - curl
        - ripgrep
        - fd-find
        - tree-sitter-cli
        - gcc
        - make
        - unzip
        - python3-neovim
        # Dux Shell required and optional components
        - quickshell
        - matugen
        - cliphist
        - wl-clipboard
        - dux-search
        - dux-calendar
        - dux-gop
        - cava
        - qt6-qtmultimedia
        - wtype
        - qt6ct
        - accountsservice
        - power-profiles-daemon
        - cups-pk-helper
        - i2c-tools
        - NetworkManager
        # Input method and Rime
        - fcitx5
        - fcitx5-gtk
        - fcitx5-qt
        - fcitx5-rime
        - fcitx5-configtool
        - librime-lua
        - librime-octagram
        # Applications
        - microsoft-edge-stable
        # QEMU/KVM virtualization stack
        - qemu-kvm
        - libvirt-daemon-kvm
        - libvirt-daemon-config-network
        - libvirt-client
        - virt-install
        - virt-manager
        - virt-viewer
        - edk2-ovmf
        - swtpm
        - dnsmasq

  - type: files
    files:
      - source: system
        destination: /

  - type: fonts
    fonts:
      nerd-fonts:
        - CascadiaCode
        - JetBrainsMono

  - type: script
    scripts:
      - install-clash-verge-rev.sh

  - type: systemd
    system:
      enabled:
        - greetd.service
        - waydroid-container.service
        - virtqemud.service
        - virtnetworkd.socket

  - type: default-flatpaks
    configurations:
      - scope: system
        notify: true
        install:
          - com.tencent.WeChat
          - com.tencent.wemeet
          - com.qq.QQ
          - com.valvesoftware.Steam
          - net.lutris.Lutris
      - scope: user

  - type: signing
