# Default Kitty configuration for Fedora Niri.
# Copied to ~/.config/kitty/kitty.conf on first login if absent.
font_family CaskaydiaCove Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto
font_size 11.0

shell /usr/bin/fish
enable_audio_bell no
confirm_os_window_close 0
copy_on_select yes
mouse_hide_wait 3.0
scrollback_lines 10000
shell_integration enabled
term xterm-kitty
